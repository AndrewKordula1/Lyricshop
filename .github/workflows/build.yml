# Lyricshop — Windows-only build and release.
#
# Windows is the only platform with a built binary. Linux and macOS users
# build from source (`cargo build --release`); the app is tested on
# Windows, and the Linux/macOS builds are not verified on every change.
#
# - Push to main (or a pull request): builds and tests on Windows, to
#   catch breakage. No release is made.
# - Push a tag matching `v*` (lowercase, e.g. `v1.0.0`): builds the
#   release binary, zips it with the README and LICENSE, and attaches it
#   to a GitHub Release. A capital-V tag will NOT trigger the release.

name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/lyricshop.exe dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath Lyricshop-windows.zip

      - name: Upload Windows build artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Lyricshop-windows
          path: Lyricshop-windows.zip

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Lyricshop-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Lyricshop-windows.zip
